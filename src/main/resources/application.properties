spring.application.name=Sistema_CarAsist
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/project_asistCar
spring.datasource.username=postgres
spring.datasource.password=admin
#spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA/Hibernate para manejo de esquema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ============================================================================
# SECURITY CONFIGURATION - OAuth2
# ============================================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081

# ============================================================================
# JWT CONFIGURATION
# ============================================================================
# Secret key (Base64) - CAMBIAR EN PRODUCCIÓN
jwt.secret=${JWT_SECRET:N2cmR1dmezJSX2FNOjFnIyNtOStrIV4iMQ==b3xLM2M3UmlnZVJtQCFDc1sjQUNkIlgzT1JFSVUmSG5afSlpX1N0RUdGck9LJGBSNlwsKnJObXFxdlkyWmgocHU=fXdUTWE7RkBMKUldemtuRVQ5Li0+SjsyOUxhTzlSbCt2OXo8SDE=eGM2fWtbdGJpWDBRPC4qZWdwJThCTHVgfVBuQ1g9TSk1IXM=}
# Access Token: 15 minutos (en milisegundos)
jwt.expiration=900000
# Refresh Token: 7 días (en milisegundos)
jwt.refresh-expiration=604800000
# Emisor del token
jwt.issuer=auth-service

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging.level.root=INFO
logging.level.com.tuempresa=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
